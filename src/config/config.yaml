modules:
  - name: Bluetooth
    id: bluetooth
    type: MadeByRob_Bluetooth

  - name: WirePlumber
    id: wireplumber
    type: WirePlumber
    subscribe:
      mute: connector/device/canbus/front_panel_mute/state
      volume: connector/device/canbus/front_panel_volume/state

  - name: CAN-Bus
    id: canbus
    type: MadeByRob_Socketcan

  - name: B2B-Laderegler
    id: booster
    type: Ective_BB
    #type: Votronic_VCC_1212
    connection:
      port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1.3:1.0-port0

  - name: Solar-Laderegler
    id: solar
    type: Ective_DSC
    connection:
      port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1.2:1.0-port0

  - name: Dieselheizung
    id: heater
    type: Autoterm_Air_2D
    connection:
      port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1.4:1.0-port0

  - name: Wechselrichter
    id: wechselrichter
    type: Ective_CSI
    connection:
      port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1.1:1.0-port0

  - name: Akku
    id: battery
    type: JBD_BMS
    connection:
      port: /dev/serial/by-path/platform-xhci-hcd.1-usbv2-0:1.2:1.0-port0

  - name: Bewegungssensor
    id: bewegungssensor
    type: MPU_6050
    connection:
      bus: 1
      address: 0x68
    axles:
      x:
        map: 'x'
        flip: true
        offset: 0
      y:
        map: 'y'
        flip: false
        offset: 50
      z:
        map: 'z'
        flip: false
        offset: 0
  
  - name: Libgpiod
    id: libgpiod
    type: RaspberryPi_Libgpiod
    pins:
      - name: GPIO17
        id: 17
        type: out
        inverted: true
      - name: GPIO22
        id: 22
        type: out
        inverted: true
      - name: GPIO23
        id: 23
        type: out
        inverted: true
      - name: GPIO27
        id: 27
        type: out
        inverted: true

